# Secret **模板**（不是真密钥）。
#
# 三条纪律（与 Dockerfile 的"密钥绝不进镜像"是一条链的两端）：
#   1. 本文件里**没有任何真实值**——`stringData` 全部留空，占位符写的也是"从哪来"而不是值；
#   2. 真值由部署方用下面任一方式注入，**不入库、不提交**：
#        kubectl -n hippocampus create secret generic hippocampus-secrets \
#          --from-literal=DEEPSEEK_API_KEY=... \
#          --from-file=instance_token=<本机已有的 instance_token 文件>
#      或交给外部密钥管理（SealedSecrets / External Secrets / Vault Agent 注入）；
#   3. 实例令牌走**文件**而不是环境变量：代码只在 <数据根>/instance_token 这个位置读它
#      （memory/config.py `instance_token_path()`），所以这里用 subPath 挂进数据根。
#      令牌文件本身是 0600 的本地文件，容器里同样只给 10001 读。
apiVersion: v1
kind: Secret
metadata:
  name: hippocampus-secrets
  namespace: hippocampus
  labels:
    app.kubernetes.io/name: hippocampus
type: Opaque
stringData:
  # 模型凭据：唯一入口是环境变量（memory/config.py `resolve_api_key()`，只有三个变量名）
  DEEPSEEK_API_KEY: ""          # 占位为空；由 `kubectl create secret` 或外部密钥管理注入
  # 实例令牌：48 位十六进制，等价于本机 <数据根>/instance_token 的内容
  instance_token: ""            # 占位为空；挂成 <数据根>/instance_token 供启动闸与探针使用
  # ↑ 两个值都留空时，Pod 会在启动闸处**明确拒起（退出码 2）**而不是裸奔——这是刻意的失败姿态。
