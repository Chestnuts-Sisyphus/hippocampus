[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# 项目名（README／CLI／import 包／仓库）是 **Hippocampus**；这里是 PyPI 上的**分发名**，
# 按栗子指定取 `hippocampus-agent`。两点要知道：
#   ① 裸名 `hippocampus` 不能用作分发名——PyPI 上那是别人的包（sqlite memoization），
#      写它会让 `pip install hippocampus` 装到第三方的东西（见 docs/naming.md 实测）；
#   ② 分发名只在 `pip install` / `pip show` 出现，不影响项目名与命令行。
name = "hippocampus-agent"
version = "0.2.1"
description = "以记忆为核心的 agent 运行时：记忆核心 + 代理形态 + Agent 形态"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Hippocampus contributors" }]
keywords = ["agent", "memory", "llm", "langgraph", "retrieval"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "jieba>=0.42",
  "httpx>=0.27",
  # Agent 形态是本项目的三种能力之一（记忆核心／代理形态／Agent 形态），
  # 编排底座因此是**核心依赖**——不能可选，否则"一条命令跑 demo"就断了。
  "langgraph>=0.2",
  "langchain-core>=0.3",
]

[project.optional-dependencies]
# 向量索引（四通道检索的语义通道）。缺省安装下语义通道降级为纯词法，其余通道不受影响。
vector = ["chromadb>=0.5"]
# 官方判分臂（bench --model-arm）：LoCoMo 官方 F1 的 Porter 词干（nltk）
eval = ["nltk>=3.8"]
# 代理形态：OpenAI 兼容端点
proxy = ["fastapi>=0.110", "uvicorn>=0.27"]
# Agent 形态：LangGraph 编排 + LangChain 工具
agent = ["langchain-openai>=0.2"]
# 全部形态（含向量通道与代理端点；离线档不需要这些）
all = [
  "chromadb>=0.5",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "langchain-openai>=0.2",
]
dev = ["pytest>=8.0", "ruff>=0.6", "psutil>=5.9"]

[project.scripts]
hippocampus = "hippocampus.cli:main"

[project.urls]
Homepage = "https://github.com/Chestnuts-Sisyphus/hippocampus"
Repository = "https://github.com/Chestnuts-Sisyphus/hippocampus"
Issues = "https://github.com/Chestnuts-Sisyphus/hippocampus/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/hippocampus"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
  "E501",   # 行长由 ruff format 语义约束，中文项目不强断行
  "B008",   # 允许函数默认值里的调用（dataclass 风格）
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "E402"]
# 随迁测试：前身导入器（import_runner）不在本项目范围，相关用例已显式标 xfail，
# 但函数体里仍引用该名字 → 该目录放行 F821。
"tests/ported/*" = ["F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: 慢测试（可选跳过）",
  "needs_vector: 需要 chromadb 向量索引",
  "needs_agent: 需要 langgraph/langchain",
]
