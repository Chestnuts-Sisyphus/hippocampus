name: CI

# 全程无 key、无网（离线档）：CI 跑的就是"什么都没配"时的能力边界。
# 两个任务：
#   full       —— 装齐可选依赖（向量 + 代理），跑完整测试与全部检查脚本
#   core-only  —— 只装核心依赖，证明"不装向量库也能跑记忆纪律"（A38 的核心口径）
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    runs-on: ${{ matrix.os }}
    # Windows default shell is pwsh, which cannot parse bash line-continuation
    # "\" in multi-line run steps (sentinel step ParserError). bash ships with
    # windows-latest runners; ubuntu default is already bash.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    env:
      # 关键：CI **不注入任何凭据**，并显式打开离线档。
      # 任何"偷偷需要模型"的代码路径都会在这里失败。
      HIPPOCAMPUS_OFFLINE: "1"
      HIPPOCAMPUS_HOME: ${{ github.workspace }}/_ci_home
      # Windows runners use a cp1252 console; without this, printing Chinese
      # from inline `python -c` raises UnicodeEncodeError (offline-smoke step).
      PYTHONIOENCODING: "utf-8"
      # Round-9 W4 (batch-B CI red, root-caused): the gap-ledger guard used to `pytest.skip`
      # on every CI run. Pointing the env var at the in-repo synthetic fixture makes the guard
      # really execute. It must live at **job** level: the no-phantom-skip check is a separate
      # step, and a step-scoped env left that check running blind (it then correctly turned red).
      HIPPOCAMPUS_GAP_LEDGER: tests/fixtures/gap_ledger_synthetic.md
    steps:
      # Full history: the leak gate below scans git objects (commit messages + tag notes).
      # A shallow checkout would leave it with only HEAD, so the git-object exit would be
      # scanned in name only. Cost is one extra fetch on a small repo.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装（核心 + 开发依赖 + 可选形态）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,vector,proxy]"

      - name: 测试（含随迁的记忆层测试）
        # Round-9 W4: HIPPOCAMPUS_GAP_LEDGER is set at job level (see `env:` above) so the
        # gap-ledger guard runs here instead of `pytest.skip`-ing on every CI run; the
        # no-phantom-skip step below proves it really ran. Real (local-only) ledger drift is
        # still caught by running the identical assertion locally with the env var pointed there.
        run: python -m pytest tests/ -q

      - name: Round-9 W4 no-phantom-skip check (ledger guard must not skip on CI)
        # Fails if the ledger guard is skipped even though CI configured the fixture.
        run: |
          python -m pytest tests/test_n23_t3_small_fixes.py -q -rs --basetemp="${{ runner.temp }}/pt-n23" \
            | tee n23.log
          python - <<'PY'
          import sys
          text = open("n23.log", encoding="utf-8", errors="replace").read()
          if "SKIPPED" in text or "skipped" in text:
              print("ledger guard skipped on CI despite HIPPOCAMPUS_GAP_LEDGER being set")
              sys.exit(1)
          print("ledger guard really ran on CI (0 skipped)")
          PY

      - name: 接口契约（v1 冻结）
        run: python scripts/check_interface.py

      - name: 依赖审计（全局依赖残留必须为 0）
        run: python scripts/audit_deps.py

      - name: 凭据扫描（零命中）
        run: python scripts/scan_credentials.py

      - name: Public-surface leak gate (zero hits, incl. git objects + releases)
        # Round-8 V3: this repo is PUBLIC. The two leaks found late on 09-19 were only
        # spotted by hand-running git grep, and the first sanitization pass missed
        # tests/ because it scanned docs only. Hence this gate walks the tracked tree
        # including *.py and fails on credential-locator shapes (registry paths,
        # "line N" pointers, out-of-repo source-of-truth dirs, local account paths).
        # Round-9 W5: the working tree is only one of three egress points. --git-text adds
        # commit messages, tag annotations and release bodies; history is not rewritten
        # (round-8 V2 decision), so pre-existing hits are tracked as a baseline count that
        # may only shrink -- one new clue in a commit message turns this step red.
        run: python scripts/scan_public_leak.py --git-text

      - name: 形态路径必须真跑（不允许静默跳过）
        # 装了 proxy extra（uvicorn/fastapi/httpx）这三类路径才可能跑：真服务器三格式、
        # 真流式、实例令牌鉴权、带 tools 的三向端到端。先断言能力在，再跑这些文件——
        # 这样"CI 里其实是 skip"这种假绿不会出现（F6）。
        run: |
          python -c "import uvicorn, fastapi, httpx; print('proxy extra ready')"
          python -m pytest tests/test_t6_real_server.py tests/test_n6_streaming.py tests/test_n7_auth_passthrough.py tests/test_n15_proxy_tools.py -q

      - name: Round-8 V5 live management-port smoke (real CLI process, five HTTP semantics)
        # Round-7's two live smoke runs caught real defects that full-green pytest missed
        # (/run bare 500, /health field mislabel). This keeps that layer as a standing gate:
        # spawns `hippocampus serve` as a real subprocess on a random free port with an
        # isolated home, server output goes to a file (never an unread PIPE), process is
        # always killed. Asserts 200/401/400/404/502. Zero egress, zero credentials.
        run: python scripts/live_management_smoke.py

      - name: Round-9 W6 live model-port smoke (proxy form, three inbound formats + auth + refusal)
        # Round-8 V5 proved the management port end-to-end in a real process; the proxy form
        # only had in-process coverage, so W1's auth wiring could regress on the real CLI
        # unnoticed. This spawns `hippocampus proxy` on a random free port against a
        # loopback stub upstream (zero egress), asserts chat/responses/messages 200,
        # /health + /v1/models 200 on loopback, 401 without the token, and that
        # --host 0.0.0.0 without --allow-remote refuses to start (rc 2, port left free),
        # then fails on any leftover process (psutil).
        run: python scripts/live_proxy_smoke.py

      - name: Round-7 live tools dry-run gate (--selfcheck)
        # These two were manual-only artifacts. V5 downgrades them to CI-resident dry runs:
        # supersede probe runs one pair against a fresh temp home on the lexical tier;
        # attribution runs on the in-repo fixture with synthetic rows (no official numbers touched).
        run: |
          python scripts/live_supersede_probe.py --selfcheck
          python scripts/bench_cat_attrib.py --selfcheck

      - name: 离线冒烟：doctor → seed → demo ＋ **阈值断言**（分数回归会被 CI 抓到）
        # 阈值口径：记忆开 ≥ 9/10、记忆关 ≤ 6/10（本机实测 10/10 与 3/10，留余量防脆）。
        # 分数只降不升说明记忆层退化——这条断言就是"回归红线"（N17-C2）。
        run: |
          hippocampus doctor
          hippocampus --account ci seed
          hippocampus --account ci demo --questions 10 --memories --json demo.json
          python -c "import json,sys; d=json.load(open('demo.json',encoding='utf-8')); a={x['name']:x for x in d['arms']}; on=a['记忆开']['passed']; off=a['记忆关']['passed']; print('记忆开',on,'/10  记忆关',off,'/10'); sys.exit('阈值断言失败：记忆开 %s<9 或 记忆关 %s>6' % (on,off)) if (on<9 or off>6) else print('阈值断言通过')"

      - name: 候选集哨兵（消融脚本小样本口径＋阈值断言）
        # 哨兵（A5/六轮 G8）：全开档证据命中低于阈值 → 红（召回退化会被 CI 抓到）。
        # 口径：CI 无网、零下载 → 词法档 builtin-hash + 仓内 fixture（1 段对话 199 题）；
        # 本机标定全开证据命中 31.66%（n=199，标准误 ±3.3pp）→ 阈值 25.0（留 ~2σ）。
        # 全量档阈值 45.0 是神经档口径（本机跑），与 CI 档无关，见脚本 docstring。
        run: |
          python scripts/bench_ablation_channels.py \
            --data tests/fixtures/locomo_conv26.json \
            --convs 1 \
            --home-root "${{ runner.temp }}/abl-ch-ci" \
            --sentinel --sentinel-threshold 25.0

      - name: 示例库扫描（无个人数据、无真实记忆）
        # scan_personal_data expects the demo ROOT (hippocampus.db lives at root level,
        # seed --account ci writes into <root>/hippocampus.db; accounts/<name>/ holds jsonl only)
        run: python scripts/scan_personal_data.py --home "${{ env.HIPPOCAMPUS_HOME }}"

  core-only:
    runs-on: ubuntu-latest
    env:
      HIPPOCAMPUS_OFFLINE: "1"
      HIPPOCAMPUS_HOME: ${{ github.workspace }}/_core_home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 只装核心依赖（不装向量库 / 不装代理端点）
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 无向量库也能做完整记忆纪律
        run: |
          hippocampus doctor
          hippocampus --account core seed
          hippocampus --account core demo --questions 10 --memories
          hippocampus --account core memory list --limit 5
          hippocampus --account core memory pending

      - name: Round-9 W4 degradation tier is real (chromadb must be absent, not silently present)
        # Without this assertion the job could quietly install the vector extra and "prove"
        # the core tier on a full stack. Assert absence, then assert the code path reports
        # a degraded tier instead of raising.
        run: |
          python - <<'PY'
          import importlib.util
          import sys

          assert importlib.util.find_spec("chromadb") is None, "chromadb is installed -- core tier not isolated"
          from hippocampus.core import MemoryCore

          core = MemoryCore()
          info = core.embedding_tier()
          print("core tier:", info)
          # embedding_tier() returns a mapping; the degraded tier must be a named string in it
          # (an earlier version of this step asserted isinstance(tier, str) -- that was the
          # step's own bug, not the code's).
          assert isinstance(info, dict), f"embedding_tier() shape changed: {type(info)}"
          tier = info.get("tier")
          assert isinstance(tier, str) and tier, "embedding_tier() must degrade to a named tier, not crash"
          core.close()
          PY

      - name: Round-9 W4 minimal pytest subset on core-only deps
        # Core-contract files that must hold without the vector/proxy extras (fastapi-backed
        # version gate lives in the full job; listing it here would ImportError on core-only).
        # A subset that silently collects zero tests would also be green, hence a count floor.
        run: |
          python -m pytest tests/test_a9_memory_crud.py tests/test_memory_core_v1.py \
            tests/test_a40_a41_safety.py tests/test_n40_r9_outbound_policy.py -q \
            --basetemp="${{ runner.temp }}/pt-core" | tee core_pytest.log
          python - <<'PY'
          import re
          import sys

          text = open("core_pytest.log", encoding="utf-8", errors="replace").read()
          nums = [int(n) for n in re.findall(r"(\d+) passed", text)]
          if not nums or nums[0] < 30:
              print(f"core-only subset too small (passed={nums}); the subset is not really running")
              sys.exit(1)
          print(f"core-only subset ran {nums[0]} tests")
          PY

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src tests scripts
