name: CI

# 全程无 key、无网（离线档）：CI 跑的就是"什么都没配"时的能力边界。
# 两个任务：
#   full       —— 装齐可选依赖（向量 + 代理），跑完整测试与全部检查脚本
#   core-only  —— 只装核心依赖，证明"不装向量库也能跑记忆纪律"（A38 的核心口径）
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    env:
      # 关键：CI **不注入任何凭据**，并显式打开离线档。
      # 任何"偷偷需要模型"的代码路径都会在这里失败。
      HIPPOCAMPUS_OFFLINE: "1"
      HIPPOCAMPUS_HOME: ${{ github.workspace }}/_ci_home
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装（核心 + 开发依赖 + 可选形态）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,vector,proxy]"

      - name: 测试（含随迁的记忆层测试）
        run: python -m pytest tests/ -q

      - name: 接口契约（v1 冻结）
        run: python scripts/check_interface.py

      - name: 依赖审计（全局依赖残留必须为 0）
        run: python scripts/audit_deps.py

      - name: 凭据扫描（零命中）
        run: python scripts/scan_credentials.py

      - name: 离线冒烟：doctor → seed → demo（无 key / 无网）
        run: |
          hippocampus doctor
          hippocampus --account ci seed
          hippocampus --account ci demo --questions 10 --memories

      - name: 示例库扫描（无个人数据、无真实记忆）
        run: python scripts/scan_personal_data.py --home "${{ env.HIPPOCAMPUS_HOME }}/accounts/ci"

  core-only:
    runs-on: ubuntu-latest
    env:
      HIPPOCAMPUS_OFFLINE: "1"
      HIPPOCAMPUS_HOME: ${{ github.workspace }}/_core_home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 只装核心依赖（不装向量库 / 不装代理端点）
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 无向量库也能做完整记忆纪律
        run: |
          hippocampus doctor
          hippocampus --account core seed
          hippocampus --account core demo --questions 10 --memories
          hippocampus --account core memory list --limit 5
          hippocampus --account core memory pending

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src tests scripts
